<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enrico Saputra Kusuma - Information Systems Student Portfolio">
  <title>Enrico Saputra Kusuma | Portfolio</title>

  <style>
    :root {
      --navy: #142b4a;
      --blue: #315b88;
      --light: #f5f7fa;
      --white: #ffffff;
      --text: #253247;
      --muted: #6b7789;
      --border: #e5eaf0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, 90%);
      margin: auto;
    }

    /* NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      color: var(--navy);
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .menu-btn {
      display: none;
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
    }

    /* HERO SECTION */
    .hero {
      background: var(--light);
      padding: 90px 0;
    }

    .hero-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero-content {
      flex: 1.2;
    }

    .hero-image-wrapper {
      flex: 0.8;
      display: flex;
      justify-content: flex-end;
    }

    .hero-image {
      width: 100%;
      max-width: 320px;
      height: 380px;
      object-fit: cover;
      border-radius: 16px;
      border: 4px solid var(--white);
      box-shadow: 0 10px 30px rgba(20, 43, 74, 0.15);
      background-color: #e2e8f0;
    }

    .eyebrow {
      color: var(--blue);
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 13px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.15;
      margin: 18px 0;
    }

    .hero p {
      color: var(--muted);
      font-size: 17px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 14px;
      display: inline-block;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--navy);
      color: white;
    }

    .btn-primary:hover {
      background: var(--blue);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--navy);
      color: var(--navy);
    }

    .btn-outline:hover {
      background: var(--navy);
      color: white;
    }

    /* GENERAL SECTIONS */
    section {
      padding: 85px 0;
      scroll-margin-top: 70px;
    }

    .section-title {
      margin-bottom: 35px;
    }

    .section-title span {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-title h2 {
      color: var(--navy);
      font-size: 32px;
      margin-top: 7px;
    }

    .section-title p {
      color: var(--muted);
      margin-top: 8px;
    }

    /* PROFILE */
    .profile-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 35px;
      align-items: start;
    }

    .profile-description p {
      color: var(--muted);
      margin-bottom: 15px;
    }

    .info-card {
      background: var(--light);
      padding: 27px;
      border-radius: 12px;
    }

    .info-card h3 {
      color: var(--navy);
      margin-bottom: 15px;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border: none;
    }

    .info-row strong {
      display: block;
      font-size: 13px;
      color: var(--navy);
    }

    .info-row span {
      font-size: 14px;
      color: var(--muted);
    }

    /* CARDS */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      background: white;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(20, 43, 74, 0.08);
    }

    .card h3 {
      color: var(--navy);
      font-size: 18px;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      background: #edf2f8;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    /* EXPERIENCE */
    .timeline {
      border-left: 2px solid var(--border);
      margin-left: 8px;
      padding-left: 28px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 30px;
    }

    .timeline-item::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      position: absolute;
      left: -35px;
      top: 8px;
    }

    .timeline-item h3 {
      color: var(--navy);
    }

    .timeline-item .date {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    .timeline-item p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 7px;
    }

    /* SKILLS */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .skill-box {
      background: var(--light);
      padding: 28px;
      border-radius: 12px;
    }

    .skill-box h3 {
      color: var(--navy);
      margin-bottom: 18px;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      background: white;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    /* CERTIFICATE GALLERY */
    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .certificate-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .certificate-card img {
      width: 100%;
      height: 210px;
      object-fit: contain;
      background: #f5f7fa;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .certificate-card img:hover {
      transform: scale(1.03);
    }

    .certificate-card h3 {
      color: var(--navy);
      font-size: 15px;
      padding: 12px 15px 3px;
    }

    .certificate-card p {
      color: var(--muted);
      font-size: 13px;
      padding: 0 15px 15px;
    }

    /* CONTACT */
    .contact {
      background: var(--navy);
      color: white;
      text-align: center;
    }

    .contact h2 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .contact p {
      color: #d0d9e5;
      margin-bottom: 25px;
    }

    .contact .btn {
      background: white;
      color: var(--navy);
    }

    footer {
      background: #10233c;
      color: #c7d0dc;
      text-align: center;
      padding: 22px;
      font-size: 13px;
    }

    /* RESPONSIVE */
    @media (max-width: 850px) {
      .hero-container {
        flex-direction: column-reverse;
        text-align: center;
      }

      .hero-image-wrapper {
        justify-content: center;
      }

      .buttons {
        justify-content: center;
      }

      .profile-grid,
      .card-grid,
      .skills-grid,
      .certificate-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .menu-btn {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        width: 100%;
        background: white;
        padding: 20px 5%;
        flex-direction: column;
        gap: 15px;
        border-bottom: 1px solid var(--border);
      }

      .nav-links.active {
        display: flex;
      }
    }
  </style>
</head>
